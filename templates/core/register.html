{% extends 'core/base.html' %}
{% block title %}Inscripción | Punto de Juego{% endblock %}
{% block content %}
<section class="content-card">
  <span class="eyebrow">Forma parte del equipo</span>
  <h1>Inscripción deportiva</h1>
  <p class="intro">Completa tus datos para crear tu cuenta y perfil de deportista.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="button" type="submit">Crear mi cuenta</button>
  </form>
</section>
{% endblock %}
