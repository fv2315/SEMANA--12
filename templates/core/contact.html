{% extends 'core/base.html' %}
{% block title %}Contacto | Punto de Juego{% endblock %}
{% block content %}
<section class="content-card">
  <span class="eyebrow">Estamos para ayudarte</span>
  <h1>Conversemos</h1>
  <p class="intro">Déjanos tu consulta sobre disciplinas, niveles o membresías.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="button" type="submit">Enviar consulta</button>
  </form>
</section>
{% endblock %}
