{% extends 'core/base.html' %}
{% block title %}Mi perfil | Punto de Juego{% endblock %}
{% block content %}
<section class="content-card">
  <span class="eyebrow">Información de deportista</span>
  <h1>Editar perfil</h1>
  <p class="intro">Mantén actualizados tus datos y preferencias deportivas.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="button" type="submit">Guardar cambios</button>
  </form>
</section>
{% endblock %}
